# risk_policy.yaml
# Shadow Apps risk policy (consumed by ui/pages/shadow_apps.py)
#
# Read order (first match wins per event):
# 1) Behavior rules from traffic patterns:
#    - bytes_sent > 10,000,000 bytes      -> Critical (Potential Exfiltration)
#    - source_log == WEIRD                -> High (Protocol Anomaly)
#    - bytes_received > 100,000,000 bytes -> Medium (Heavy Download)
# 2) Rules below (critical/high/medium: source_logs and ports)
# 3) low.app_status
# 4) default

critical:
  # Logs that usually indicate a security-relevant detection or protocol abuse
  source_logs:
    - "NOTICE"
  # NOTE: WEIRD is already mapped by behavior rule to High before policy checks.
  # Optional: add ports you consider "critical" in your environment
  ports:
    - 4444 # common C2/backdoor port (example)
    - 31337 # common backdoor example

high:
  # Remote admin / legacy / high-risk services
  ports:
    - 22 # SSH
    - 23 # Telnet
    - 3389 # RDP
    - 5900 # VNC
  # Optional: treat certain logs as high signal in your environment
  source_logs:
    - "SOFTWARE" # software inventory/install activity (optional)

medium:
  # Common database ports (often sensitive)
  ports:
    - 1433 # SQL Server
    - 3306 # MySQL
    - 5432 # PostgreSQL
  # Optional: file activity can be meaningful for shadow upload / install trails
  source_logs:
    - "FILES" # file transfers / file observations (optional)

low:
  # Baseline "trusted/normal" status. Anything else falls to default below.
  app_status:
    - "Authorized"

# Default baseline for traffic that doesn't match rules above.
# Recommended: "Low" (instead of "Safe") so unknown traffic isn't automatically "green".
default: "Low"
