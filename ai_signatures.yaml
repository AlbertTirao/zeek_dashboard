  11434: Ollama
  1234: LM Studio
  7860: HuggingFace Gradio
  8000: FastAPI LLM Server
  5000: Local Flask AI
  8080: Open WebUI
  3000: Local AI Web App
  5678: n8n
authorized_providers:
- OpenAI / ChatGPT
generic_name_patterns:
- \bgpt\b
- \bcopilot\b
- \bagent\b
- \bllm\b
- \bgenai\b
- \bai\b
- openai|anthropic|gemini|perplexity|manus|deepseek|copilot
saas_allowlist_domains: []
detection_settings:
  baseline_days: 30
  large_https_post_threshold_mb: 5
  medium_https_post_threshold_mb: 1
  high_frequency_calls_per_hour: 50
  json_post_calls_per_hour: 20
  small_request_max_kb: 64
  smb_window_minutes: 5
file_upload_extensions:
- csv
- xlsx
- xls
- pdf
- zip
- json
