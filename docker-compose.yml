services:
  auth-mongo:
    image: mongo:7
    container_name: zeek-auth-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-zeek_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-zeek_root_dev}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-zeek_auth}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - zeek_auth_mongo_data:/data/db

volumes:
  zeek_auth_mongo_data:
